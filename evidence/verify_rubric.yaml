rubrics:
  - id: 1
    type: p2p
    text: 未修改 profile 的相同请求仍能命中完整缓存；raw/direct play、未配置转码的播放器以及既有多协议响应不新增转码或全局清缓存。
  - id: 2
    type: f2p
    text: 修改 command、默认码率或目标格式后，新请求使用同一个已提交配置快照并且不会命中旧配置生成的音频，即使媒体文件和输出参数表面相同。
  - id: 3
    type: f2p
    text: 配置切换时已经运行的旧转码不会把迟到结果发布到新代缓存；并发的新旧请求各自获得与其配置快照一致的完整结果。
  - id: 4
    type: f2p
    text: 转码配置的数据库更新失败时，活动配置、播放器决策和旧代缓存继续可用，不产生只在部分组件生效的新代。
  - id: 5
    type: f2p
    text: 删除仍被一个或多个播放器引用的 profile 时，管理操作确定地拒绝或完成明确回退并同步引用，后续播放不会因悬空 TranscodingId 随机返回错误。
  - id: 6
    type: f2p
    text: 服务重启只恢复与最后已提交配置代际匹配的完整缓存；旧代、未完成或失败结果不能在重启后重新成为命中。
  - id: 7
    type: f2p
    text: Subsonic、Jellyfin、分享流和格式化下载对同一已提交代际使用兼容的决策与缓存身份，不会只在某一个入口修复陈旧缓存。
