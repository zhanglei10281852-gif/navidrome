rubrics:
  - id: 1
    type: p2p
    text: 首次上传和正常替换仍遵守现有权限、大小与格式校验；未设置自定义图时继续使用原有 artwork 来源，成功响应和图片读取行为不回归。
  - id: 2
    type: f2p
    text: 上传流短读、写入或关闭失败时，最终图片路径不会出现半文件，实体引用与旧封面保持不变，后续重试能够成功。
  - id: 3
    type: f2p
    text: 候选文件完整但实体数据库更新失败时，请求返回错误且旧引用和旧图片继续可服务，新候选不会成为孤儿或被 resolver 提前发布。
  - id: 4
    type: f2p
    text: 删除封面只有在实体引用能够共同提交时才使旧文件不可用；持久化失败不得留下指向缺失文件的记录。
  - id: 5
    type: f2p
    text: 实体提交后 artwork 刷新或排队失败具有可恢复结果，已提交的新引用不会被回滚成悬空状态，系统可重驱并最终让解析与读取看到同一完整图片。
  - id: 6
    type: f2p
    text: 同一实体的重试或并发替换具有确定的资源所有权，迟到的失败清理不会删除后来已提交的新图，旧文件和候选文件只在不再被引用时回收。
  - id: 7
    type: f2p
    text: 艺术家、电台和播放列表三个现有入口对写入、数据库、刷新失败及成功提交表现出同一封面不变量，而不是只修复其中一个调用路径。
