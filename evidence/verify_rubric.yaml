rubrics:
  - id: 1
    type: p2p
    text: 已禁用插件的配置或权限更新仍只持久化设置而不创建实例或 host service；按现有规则移除必需权限时仍可明确禁用。
  - id: 2
    type: f2p
    text: 运行插件的新配置在编译、实例创建、host service 建立或生命周期初始化任一步失败时，候选资源全部释放，旧实例和旧设置继续可用。
  - id: 3
    type: f2p
    text: 候选实例已验证但持久配置提交失败时不会切换活动实例或发送成功刷新，管理 API 返回错误且重启后仍加载旧成功配置。
  - id: 4
    type: f2p
    text: 成功更新使配置、用户或媒体库权限、活动实例和可观察插件能力只切换一次，之后旧实例及其调度、WebSocket、任务队列等资源被完整关闭。
  - id: 5
    type: f2p
    text: 初始化函数返回错误会被视为候选加载失败而非仅记录日志，LastError、Enabled、API 响应和刷新事件与实际仍在运行的代际一致。
  - id: 6
    type: f2p
    text: 同一插件的并发设置更新按确定顺序提交，迟到的成功或失败不会覆盖更新的持久状态、替换新实例或关闭错误代际。
  - id: 7
    type: f2p
    text: 成功更新后服务重启加载最后提交的设置；连续失败后再次保存有效设置能够恢复切换，且没有遗留候选 goroutine、文件句柄或重复 host service。
